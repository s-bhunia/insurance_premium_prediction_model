[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-premium-predictor"
version = "1.0.0"
description = "Insurance Premium Prediction API using Machine Learning"
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "pydantic",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipython",
]

[tool.setuptools]
packages = ["api"]
